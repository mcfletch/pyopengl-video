[tox]
envlist =
    lint
    typecheck
    py310
    py311
    py312
    py313
    py314
skip_missing_interpreters = true

[testenv]
package = sdist
# The stack under this package publishes pre-releases -- PyOpenGL 4.0.0a4 is
# what it requires -- and pip installs one only where the specifier names it.
# It does here, so this is not what makes the alpha resolve; it is what keeps
# the next pre-release dependency from needing this file edited too.
pip_pre = true
deps =
    pytest
    pytest-timeout
    numpy>=1.24
    glfw
# Everything that needs a GPU, a driver or an OpenGL context skips itself when
# there is none, so this is the same command on a CI runner with no graphics as
# on a workstation with three encoders -- it just reports far more skips. The
# skip reasons name what was missing, so a run that was expected to exercise
# hardware and did not says so rather than passing quietly.
commands =
    pytest {posargs:-q}

# No coverage floor, deliberately. Most of this package is driver plumbing that
# only runs with an encoder present, so on a machine without one the figure
# measures which hardware the runner has rather than what the suite covers. A
# floor low enough to pass there would assert nothing. The parts that are pure
# computation -- the H.264 bitstream writer, the group-of-pictures structure,
# the ABI tables, the muxer -- are covered by tests that need no hardware at
# all, and those are what a contribution is held to.

[testenv:lint]
skip_install = true
deps = ruff
commands = ruff check .

# Two runs, because half this package is Windows-only and half is Linux-only,
# and each is invisible to the other's platform. `ctypes.WINFUNCTYPE` and
# `ctypes.GetLastError` do not exist for a checker reading on Linux, so the
# Windows shim and the oneVPL backend are checked as Windows sees them; the
# rest, which includes everything that calls EGL and libva, is checked as
# Linux sees it. Neither run is allowed to fail.
[testenv:typecheck]
deps =
    mypy
    numpy>=1.24
    pytest
commands =
    mypy src/pyopengl_video --exclude 'src/pyopengl_video/(windows|vpl)/'
    mypy --platform win32 src/pyopengl_video/windows src/pyopengl_video/vpl

# tox-gh maps a CI interpreter to the envs it should run (see .github/workflows).
[gh]
python =
    3.10 = py310
    3.11 = py311
    3.12 = lint, typecheck, py312
    3.13 = py313
    3.14 = py314
