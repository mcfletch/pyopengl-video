[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyopengl-video"
dynamic = ["version"]
description = "Hardware video encoding of OpenGL colour buffers, with the frame never leaving the GPU"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = ["OpenGL", "video", "H.264", "NVENC", "VA-API", "encoding", "capture", "recording"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

# The encoders themselves ship with the graphics driver and are loaded by name;
# PyOpenGL is what gives us the texture and framebuffer calls to feed them.
dependencies = [
    # 4.0.0a4 is where the DMA-BUF entry points this package calls arrived;
    # 4.0.0a5 is where `glDeleteTextures(textures)` -- the one-argument form
    # this package calls, and the form PyOpenGL's own wrapper documents -- is
    # in the stub. Against a4 a type checker rejects that call, so a floor of
    # a4 is a floor at which this package does not type-check.
    #
    # The `a5` is **load-bearing** besides: PEP 440 has a resolver skip
    # pre-releases unless the specifier names one, so `>=4.0.0` would exclude
    # every 4.x there is and `pip install pyopengl-video` would fail rather
    # than fall back. `tests/test_packaging.py` holds this, so rounding it off
    # fails a test rather than shipping a distribution nobody can install.
    "PyOpenGL>=4.0.0a5",
]

[project.optional-dependencies]
# numpy is what the tests build synthetic frames with, and what a caller reads
# decoded pixels back into; the encoders need none of it.
dev = ["pytest", "pytest-timeout", "numpy>=1.24", "glfw", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/mcfletch/pyopengl-video"

[tool.setuptools.dynamic]
version = { attr = "pyopengl_video.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade
    "BLE",  # no blind except
    "S110", # no silent try/except/pass
]
ignore = [
    "E501",   # line too long -- kept readable by hand
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

# Half this package is Windows-only and half is Linux-only, so tox runs mypy
# twice -- once as each platform sees it -- and each run must look at its own
# half alone. `--exclude` does not achieve that by itself: it decides which
# files are crawled from a directory named on the command line, and a module
# reached by an `import` is still followed and checked. `pyopengl_video`
# imports `vpl`, which imports `windows`, so the Windows shim arrived in the
# Linux run through the back door and was checked against a `ctypes` with no
# `WINFUNCTYPE` in it.
#
# `follow_imports = skip` closes that door. It applies only to modules reached
# by import: a module named on the command line -- or found by crawling a
# directory that was -- is checked regardless, so each run still covers its own
# half in full. The two lists are therefore mirror images, and every module
# belongs to exactly one of them.
[[tool.mypy.overrides]]
module = [
    "pyopengl_video.windows",
    "pyopengl_video.windows.*",
    "pyopengl_video.vpl",
    "pyopengl_video.vpl.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "pyopengl_video.inputs",
    "pyopengl_video.linux",
    "pyopengl_video.linux.*",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The suite shares fixtures and frame generators through `tests.conftest`, which
# needs the project root importable. `python -m pytest` puts it there by adding
# the working directory; the `pytest` command does not, and neither does tox or
# CI, so it is stated here rather than left to how the suite happens to be
# started.
pythonpath = ["."]
timeout = 300
markers = [
    "gl: needs a live OpenGL context",
    "nvenc: needs an NVIDIA encoder",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in src/pyopengl_video/__init__.py, so name that file too: without it a
# version bump leaves uv answering with the previous number, and a dependent
# requiring the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/pyopengl_video/__init__.py" }]
